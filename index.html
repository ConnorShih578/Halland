<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>HALLAND - Endless Cyber-Karate</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; }
    body, html { width: 100%; height: 100%; overflow: hidden; background: #07090e; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; color: #f8fafc; }
    #canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
    #hud { position: absolute; top: 1rem; left: 1.2rem; right: 1.2rem; display: flex; justify-content: space-between; align-items: center; pointer-events: none; z-index: 10; font-family: monospace; font-size: 1.1rem; font-weight: 800; text-shadow: 0 2px 8px rgba(0,0,0,0.8); }
    .hud-stat { background: rgba(15, 23, 42, 0.85); padding: 0.35rem 0.8rem; border-radius: 4px; border: 1px solid rgba(255,255,255,0.1); }
    .dist-val { color: #f59e0b; }
    .score-val { color: #38bdf8; }
    #screen { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; background: rgba(7, 9, 14, 0.94); z-index: 20; gap: 1.2rem; transition: opacity 0.2s ease; }
    #screen.hidden { opacity: 0; pointer-events: none; }
    .title-wrap { text-align: center; }
    .brand { font-size: 0.75rem; letter-spacing: 0.3em; color: #ef4444; font-weight: 800; }
    h1 { font-size: 3.5rem; letter-spacing: 0.15em; font-weight: 900; color: #ffffff; text-shadow: 0 0 24px rgba(239,68,68,0.5); }
    .sub { font-size: 0.85rem; color: #94a3b8; letter-spacing: 0.1em; }
    .stats-row { display: flex; gap: 1rem; margin: 0.5rem 0; font-family: monospace; font-size: 0.85rem; color: #cbd5e1; }
    .stat-pill { background: rgba(255,255,255,0.06); padding: 0.3rem 0.6rem; border-radius: 4px; }
    #btn-start { background: linear-gradient(135deg, #ef4444, #dc2626); color: #ffffff; border: none; padding: 1rem 3.5rem; font-size: 1.2rem; font-weight: 900; letter-spacing: 0.15em; border-radius: 4px; cursor: pointer; box-shadow: 0 4px 20px rgba(239,68,68,0.5); transition: transform 0.1s, box-shadow 0.1s; }
    #btn-start:hover { transform: translateY(-2px); box-shadow: 0 6px 26px rgba(239,68,68,0.7); }
    #btn-start:active { transform: scale(0.96); }
    .controls-hint { font-size: 0.75rem; color: #64748b; text-align: center; line-height: 1.5; }
    #flash { position: absolute; inset: 0; background: radial-gradient(circle, transparent 50%, rgba(239,68,68,0.3) 100%); pointer-events: none; opacity: 0; z-index: 8; transition: opacity 0.08s ease; }
    #flash.flash { opacity: 1; }
  </style>
</head>
<body>
  <canvas id="canvas"></canvas>
  <div id="flash"></div>

  <div id="hud">
    <div class="hud-stat">🏃 <span id="hud-dist" class="dist-val">0m</span></div>
    <div class="hud-stat">⚡ <span id="hud-score" class="score-val">SCORE: 0</span></div>
  </div>

  <div id="screen">
    <div class="title-wrap">
      <div class="brand">TIMMY'S GAMES</div>
      <h1>HALLAND</h1>
      <div class="sub">ENDLESS CYBER-KARATE GAUNTLET</div>
    </div>

    <div class="stats-row">
      <div class="stat-pill">BEST DIST: <strong id="best-dist" style="color:#f59e0b">0m</strong></div>
      <div class="stat-pill">HIGH SCORE: <strong id="high-score" style="color:#38bdf8">0</strong></div>
    </div>

    <button id="btn-start">START RUN</button>

    <div class="controls-hint">
      <strong>A / D</strong> Move &bull; <strong>W</strong> Jump / Wall-Kick &bull; <strong>Spacebar</strong> Combo Attack &bull; <strong>S</strong> Parry / Slide &bull; <strong>Up</strong> Web Zip<br>
      <em>Mobile: Left Screen Thumbstick &bull; Right Screen Tap / Swipe</em>
    </div>
  </div>

  <script src="game.js"></script>
</body>
</html>
