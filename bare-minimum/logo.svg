<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 120" width="480" height="120">
  <defs>
    <linearGradient id="logoSuitGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#991b1b"/>
    </linearGradient>
    <linearGradient id="logoGoldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="40%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <filter id="logoGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Left Icon Emblem Group -->
  <g transform="translate(10, 8) scale(0.82)">
    <polygon points="38,4 90,4 124,38 124,90 90,124 38,124 4,90 4,38" fill="#0f172a" stroke="#f59e0b" stroke-width="3"/>
    <!-- Hair -->
    <path d="M 64,18 C 50,14 36,22 30,34 C 26,42 22,58 20,70 C 26,62 32,54 36,46 C 42,38 52,30 64,28 Z" fill="url(#logoGoldGrad)"/>
    <!-- Mask -->
    <ellipse cx="64" cy="62" rx="34" ry="40" fill="url(#logoSuitGrad)" stroke="#111827" stroke-width="3"/>
    <!-- Eyes -->
    <polygon points="40,56 58,66 54,74 38,62" fill="#ffffff" stroke="#111827" stroke-width="2.5"/>
    <polygon points="88,56 70,66 74,74 90,62" fill="#ffffff" stroke="#111827" stroke-width="2.5"/>
    <!-- Headband -->
    <path d="M 32,46 Q 64,40 96,46 L 95,50 Q 64,44 33,50 Z" fill="url(#logoGoldGrad)" stroke="#111827" stroke-width="1.2"/>
  </g>

  <!-- Typography -->
  <text x="130" y="38" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="800" letter-spacing="4" fill="#f59e0b">TIMMY'S GAMES PRESENTS</text>
  <text x="128" y="85" font-family="'Syncopate', sans-serif" font-size="44" font-weight="900" letter-spacing="3" fill="url(#textGrad)" filter="url(#logoGlow)">HALLAND</text>
  <text x="130" y="104" font-family="'Outfit', sans-serif" font-size="11" font-weight="700" letter-spacing="2" fill="#94a3b8">THE HYBRID POWERHOUSE MARTIAL ARTS SAGA</text>
</svg>
