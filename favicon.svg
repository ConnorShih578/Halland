<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#07090e"/>
    </radialGradient>
    <linearGradient id="suitGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff4d4d"/>
      <stop offset="100%" stop-color="#b91c1c"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Dark Octagonal Outer Rim -->
  <polygon points="38,4 90,4 124,38 124,90 90,124 38,124 4,90 4,38" fill="url(#bgGlow)" stroke="#f59e0b" stroke-width="3"/>

  <!-- Haaland Golden Ponytail Ribbon -->
  <path d="M 64,18 C 50,14 36,22 30,34 C 26,42 22,58 20,70 C 26,62 32,54 36,46 C 42,38 52,30 64,28 Z" fill="url(#goldGrad)" filter="url(#glow)"/>

  <!-- Spider-Man Suit Head Oval -->
  <ellipse cx="64" cy="62" rx="34" ry="40" fill="url(#suitGrad)" stroke="#111827" stroke-width="3.5"/>

  <!-- Web Line Accents -->
  <path d="M 64,22 L 64,102 M 30,62 L 98,62 M 38,36 L 90,88 M 38,88 L 90,36" stroke="#991b1b" stroke-width="1.8" opacity="0.6"/>

  <!-- Spider-Man Angular Eye Lenses -->
  <!-- Left Eye -->
  <polygon points="40,56 58,66 54,74 38,62" fill="#ffffff" stroke="#111827" stroke-width="3"/>
  <!-- Right Eye -->
  <polygon points="88,56 70,66 74,74 90,62" fill="#ffffff" stroke="#111827" stroke-width="3"/>

  <!-- Golden Karate Headband Trim -->
  <path d="M 32,46 Q 64,40 96,46 L 95,50 Q 64,44 33,50 Z" fill="url(#goldGrad)" stroke="#111827" stroke-width="1.5"/>

  <!-- Lightning Bolt Emblem at bottom -->
  <path d="M 64,98 L 68,107 L 62,109 L 66,120 L 58,111 L 63,109 Z" fill="#f59e0b" filter="url(#glow)"/>
</svg>
